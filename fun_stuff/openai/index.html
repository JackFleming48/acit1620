<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/openai/index.css" type="text/css">
    <script src="index.js" defer></script>
    <title>My own ChatGPT</title>
</head>
<body>
    <header>
        <img src="images/logo.png" alt="OpenAI Logo">
    </header>
    <div id="wrapper">
        <div class="textbox">
            <form action="" id="prompt">
                <textarea name="openai_prompt" id="openai_prompt" placeholder="Prompt OpenAI"></textarea>
            </form>
        </div>
        <button type="button" form="prompt" value="Submit">Submit Prompt</button>

    </div>
</body>
</html>
