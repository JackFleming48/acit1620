<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planets</title>
    <style>
        .redtext {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Green planet</h1>
    <p id="greenplanet">all is well</p>
    <h1>Red planet</h1>
    <p id="redplanet">nothing to report</p>
    <h1>Blue planet</h1>
    <p id="blueplanet">all systems ok</p>
    <script>
        function init() {
            let planet = document.getElementById("greenplanet");
            planet.innerHTML = "Red alert: hit by phaser!";
            planet.setAttribute("class", "redtext");
        }
        window.onload = init;
    </script>
</body>
</html>
